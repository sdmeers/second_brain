[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.135.1",
    "faster-whisper>=1.2.1",
    "google-genai>=1.63.0",
    "httpx>=0.28.1",
    "pymupdf>=1.27.1",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "sqlite-vss>=0.1.2",
    "uvicorn>=0.42.0",
    "yt-dlp>=2026.3.17",
    "openai>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "staging", "__pycache__"]

[tool.ruff.lint]
# F = pyflakes (undefined names, unused imports) - catches the class of bug that
# made /tickle, /holiday and the PDF content-type probe silently fail.
# E9 = syntax/runtime errors, B = bugbear, UP = pyupgrade.
select = ["F", "E4", "E7", "E9", "B", "UP"]
ignore = [
    "B008",  # FastAPI dependency-injection defaults
    "UP007", # Optional[X] is fine on 3.11
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
